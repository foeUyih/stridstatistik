<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoE Statistik – SE5</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- SIDHUVUD MED PROFILBILD -->
    <header class="top-header">
      <img src="uyih.jpg" alt="Profilbild" class="avatar" onerror="this.style.display='none'">
      <div>
        <h1>⚔️ FoE Stridsstatistik</h1>
        <p id="status">Laddar data.csv...</p>
      </div>
    </header>

    <!-- KONTROLLPANEL -->
    <div class="panel">
      <div class="row">
        <div>
          <label for="franDag">Från dag:</label>
          <input type="number" id="franDag" min="1" value="1">
        </div>
        <div>
          <label for="tillDag">Till dag:</label>
          <input type="number" id="tillDag" min="1" value="1">
        </div>
        <div>
          <label for="stjarnLag">Stjärna (⭐) för lag:</label>
          <input type="text" id="stjarnLag" value="Excalibur" placeholder="T.ex. Excalibur">
        </div>
        <div>
          <label for="antalTopp">Antal i listor:</label>
          <input type="number" id="antalTopp" min="5" max="200" value="20">
        </div>
        <div style="align-self: end;">
          <button id="kopieraBtn" onclick="kopieraText()">📋 Kopiera till spelet</button>
        </div>
      </div>

      <!-- IMPERIEURVAL -->
      <div style="margin-top: 16px;">
        <div class="imp-header">
          <label style="margin:0;">Urval imperier (lämna tomt för Topp X • kryssa i <b>( )</b> för parentes):</label>
          <button type="button" class="btn-mini" onclick="rensaVal()">Rensa val</button>
        </div>
        <div id="imperieLista" class="imp-box">Laddar imperier...</div>
      </div>
    </div>

    <!-- FLIKMENY -->
    <div class="tabs">
      <button class="tab-btn active" onclick="bytFlik('imperier', this)">📊 Imperier</button>
      <button class="tab-btn" onclick="bytFlik('spelare', this)">⚔️ Spelare</button>
      <button class="tab-btn" onclick="bytFlik('effektivitet', this)">⚡ Stridsindex</button>
      <button class="tab-btn" onclick="bytFlik('hojdpunkter', this)">🏆 Höjdpunkter</button>
      <button class="tab-btn" onclick="bytFlik('duell', this)">🥊 Rivalduellen</button>
      <button class="tab-btn" onclick="bytFlik('form', this)">🔥 Formkurvan</button>
      <button class="tab-btn" onclick="bytFlik('imperieinfo', this)">🏰 Imperieinfo</button>
    </div>

    <!-- FÄRDIG UTSKRIFT (För statistikflikarna) -->
    <div id="utskriftPanel" class="panel" style="margin-top: 10px;">
      <pre id="utskrift">Väntar på data...</pre>
    </div>


  <script src="data.js"></script>
  <script src="reports_main.js"></script>
  <script src="reports_extra.js"></script>
  <script src="app.js"></script>
</body>
</html>
