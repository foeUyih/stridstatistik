<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sök i databasen</title>
  <script src="https://cloudflare.com"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    .controls { display: flex; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; }
    input { flex: 1; min-width: 250px; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    #status { color: #555; font-size: 0.9rem; margin-bottom: 1rem; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { border-bottom: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f8f9fa; font-weight: 600; position: sticky; top: 0; }
    tr:hover { background-color: #f1f5f9; }
  </style>
</head>
<body>

  <h2>Sök i databasen</h2>
  
  <div class="controls">
    <input type="text" id="searchInput" placeholder="Laddar data..." disabled>
  </div>
  
  <div id="status">Hämtar rader från kalkylarket...</div>
  
  <div class="table-wrap">
    <table id="dataTable"></table>
  </div>

  <script>
    // KLISTRA IN DIN LÄNK NEDAN (behåll citattecknen runt länken):
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmo5dVfsfNF8au_pUgwFWc0p1vOj6GO6tYpMoa4hGHHC2-512VpBUkbrsxhX74ev2dma8Hd1zfBnRk/pub?gid=907058282&single=true&output=csv';
    
    let allData = [];
    let headers = [];

    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        allData = results.data;
        headers = results.meta.fields;
        const input = document.getElementById('searchInput');
        input.placeholder = `Sök bland ${allData.length} rader...`;
        input.disabled = false;
        updateView(allData);
      },
      error: function() {
        document.getElementById('status').textContent = 'Kunde inte hämta data. Kontrollera CSV-länken.';
      }
    });

    document.getElementById('searchInput').addEventListener('input', function(e) {
      const terms = e.target.value.toLowerCase().trim().split(/\s+/);
      const filtered = allData.filter(row => {
        const rowText = Object.values(row).join(' ').toLowerCase();
        return terms.every(term => rowText.includes(term));
      });
      updateView(filtered);
    });

    function updateView(rows) {
      const limit = 100;
      document.getElementById('status').textContent = 
        rows.length > limit 
          ? `Visar de första ${limit} av ${rows.length} träffar.` 
          : `Visar ${rows.length} träffar.`;
      
      const table = document.getElementById('dataTable');
      if (rows.length === 0) {
        table.innerHTML = '';
        return;
      }
      
      const thead = `<thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>`;
      const tbody = `<tbody>${rows.slice(0, limit).map(row => 
        `<tr>${headers.map(h => `<td>${row[h] || ''}</td>`).join('')}</tr>`
      ).join('')}</tbody>`;
      
      table.innerHTML = thead + tbody;
    }
  </script>

</body>
</html>
