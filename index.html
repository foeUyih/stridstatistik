<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Sök i kalkylark</title>
  <script src="https://cloudflare.com"></script>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    input { width: 100%; padding: 10px; font-size: 16px; margin-bottom: 1rem; box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f4f4f4; }
  </style>
</head>
<body>

  <h2>Sök i databasen</h2>
  <input type="text" id="searchInput" placeholder="Skriv för att söka..." disabled>
  <p id="status">Laddar data...</p>
  <table id="dataTable"></table>

  <script>
    // Klistra in din publicerade CSV-länk från Google Kalkylark här:
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQmo5dVfsfNF8au_pUgwFWc0p1vOj6GO6tYpMoa4hGHHC2-512VpBUkbrsxhX74ev2dma8Hd1zfBnRk/pub?gid=907058282&single=true&output=csv';
    
    let allData = [];
    let headers = [];

    // 1. Hämta och tolka CSV-datan när sidan laddas
    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        allData = results.data;
        headers = results.meta.fields;
        document.getElementById('status').textContent = `Visar de första 100 av ${allData.length} rader.`;
        document.getElementById('searchInput').disabled = false;
        renderTable(allData.slice(0, 100)); // Visa max 100 rader åt gången för prestanda
      }
    });

    // 2. Filtrera när användaren skriver i sökfältet
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const query = e.target.value.toLowerCase();
      const filtered = allData.filter(row => 
        Object.values(row).some(val => String(val).toLowerCase().includes(query))
      );
      document.getElementById('status').textContent = `Hittade ${filtered.length} träffar (visar max 100).`;
      renderTable(filtered.slice(0, 100));
    });

    // 3. Rita ut tabellen
    function renderTable(rows) {
      const table = document.getElementById('dataTable');
      if (rows.length === 0) {
        table.innerHTML = '';
        return;
      }
      const thead = `<tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>`;
      const tbody = rows.map(row => 
        `<tr>${headers.map(h => `<td>${row[h] || ''}</td>`).join('')}</tr>`
      ).join('');
      table.innerHTML = thead + tbody;
    }
  </script>

</body>
</html>
